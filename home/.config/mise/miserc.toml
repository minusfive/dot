# Load platform-specific conf.d fragments such as mise.macos.toml.
auto_env = true

# mise renders this file before it applies [env] values from config.toml.
# Set DOT_PROFILE before mise starts so this module list matches the profile.
# Interactive Zsh startup and the setup instructions load the persisted value.
# https://mise.jdx.dev/templates.html#miserc-template-support
{% set shared_modules = [
    '1password',
    'agents',
    'aliases',
    'betterdisplay',
    'bat',
    'brew',
    'btop',
    'bun',
    'claude',
    'copilot',
    'coreutils',
    'curl',
    'delta',
    'docker-desktop',
    'dockutil',
    'editorconfig',
    'eza',
    'fd',
    'findutils',
    'fzf',
    'gh',
    'ghostscript',
    'ghostty',
    'git',
    'github-copilot',
    'gnu-sed',
    'go',
    'google-chrome',
    'gpg-suite',
    'harper',
    'hammerspoon',
    'htop',
    'imagemagick',
    'imageoptim',
    'jq',
    'just',
    'lazygit',
    'libtiff',
    'libyaml',
    'luarocks',
    'mas',
    'mermaid-cli',
    'mermaid-formatter',
    'mise',
    'node',
    'nvim',
    'obsidian',
    'oh-my-zsh',
    'p10k',
    'packages',
    'pkl-lsp',
    'pitchfork',
    'prettier',
    'python',
    'qmd',
    'ripgrep',
    'ruby',
    'rumdl',
    'rust',
    'sqlite',
    'stow',
    'stylua',
    'tectonic',
    'tmux',
    'tree-sitter',
    'tuicr',
    'vivid',
    'wallpaper',
    'wget',
    'wezterm',
    'yarn',
    'yazi',
    'yq',
    'yubico-authenticator',
    'zoxide',
    'zsh',
] %}
{% set work_profile_modules = [] %}
{% set personal_profile_modules = [
    "discord",
    "opencode",
    "softraid",
    "whatsapp",
] %}
{% if env.DOT_PROFILE | default(value='work') == 'personal' %}
env = {{ [...personal_profile_modules, ...shared_modules] }}
{% else %}
env = {{ [...work_profile_modules, ...shared_modules] }}
{% endif %}
env_conf_d = true
