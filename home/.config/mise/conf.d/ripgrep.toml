[bootstrap.packages]
"brew:ripgrep" = "latest"

[dotfiles]
"ripgrep/config/ripgrep/.ripgreprc" = { source = "~/dev/personal/dot/home/.config/ripgrep/.ripgreprc", mode = "symlink", variants = [{ default = true, target = "{{ xdg_config_home }}/ripgrep/.ripgreprc" }] }
"~/.config/zsh/.zshrc-zone-3.zsh/ripgrep" = { source = "~/dev/personal/dot/home/.config/ripgrep/zshrc.zsh", template = "tera" }
