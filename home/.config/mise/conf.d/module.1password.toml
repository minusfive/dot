[bootstrap.packages]
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
# 1Password for Safari
"mas:1569813296" = "latest"

[dotfiles]
"~/.config/1Password" = { source = "~/dev/personal/dot/home/.config/1Password", mode = "symlink-each" }
"~/.ssh/config" = { source = "~/dev/personal/dot/home/.ssh/config", mode = "symlink" }
