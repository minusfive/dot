[bootstrap.packages]
"brew:git" = "latest"

[dotfiles]
"git/config/git" = { source = "~/dev/personal/dot/home/.config/git", mode = "symlink-each", exclude = ["zshrc.zsh"], variants = [{ default = true, target = "{{ xdg_config_home }}/git" }] }
"~/dev/personal/.domains" = { source = "~/dev/personal/dot/home/dev/personal/.domains", mode = "symlink" }
"~/.config/zsh/.zshrc-zone-0.zsh/git" = { source = "~/dev/personal/dot/home/.config/git/zshrc.zsh", template = "tera" }
