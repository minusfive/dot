[bootstrap.packages]
"brew:fzf" = "latest"

[dotfiles]
"fzf/config/fzf/fzf.conf" = { source = "~/dev/personal/dot/home/.config/fzf/fzf.conf", mode = "symlink", variants = [{ default = true, target = "{{ xdg_config_home }}/fzf/fzf.conf" }] }
"~/.config/zsh/.zshrc-zone-3.zsh/fzf" = { source = "~/dev/personal/dot/home/.config/fzf/zshrc.zsh", template = "tera" }
