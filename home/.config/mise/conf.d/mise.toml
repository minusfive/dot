[settings.self_update]
auto = true
minimum_release_age = "2d"

[bootstrap.hooks]
pre-packages = "mise run bootstrap:pre-packages"
pre-dotfiles = "mise run bootstrap:pre-dotfiles"
post-dotfiles = "mise run bootstrap:post-dotfiles"
post-tools = "mise run bootstrap:post-tools"
final = "mise run bootstrap:final"

[dotfiles]
"mise/state/minusfive/profile" = { source = "~/dev/personal/dot/home/.config/mise/profile.tmpl", mode = "template", template = "tera", variants = [
  { default = true, target = "{{ xdg_state_home }}/minusfive/profile" },
] }
