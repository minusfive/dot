[bootstrap.packages]
"brew:zsh" = "latest"

[dotfiles]
"~/.config/zsh" = { source = "~/dev/personal/dot/home/.config/zsh", mode = "symlink-each", exclude = [".p10k.zsh", ".zshrc", ".zshrc-zone-0.zsh", ".zshrc-zone-2.zsh"] }
"~/.config/zsh/.zshrc/zshrc" = { source = "~/dev/personal/dot/home/.config/zsh/.zshrc", template = "tera" }
"~/.config/zsh/.zshrc-zone-0.zsh/bootstrap" = { source = "~/dev/personal/dot/home/.config/zsh/.zshrc-zone-0.zsh", template = "tera" }
"~/.config/zsh/.zshrc-zone-2.zsh/user" = { source = "~/dev/personal/dot/home/.config/zsh/.zshrc-zone-2.zsh", template = "tera" }
"~/.zshenv" = { source = "~/dev/personal/dot/home/.config/zsh/.zshenv", mode = "symlink" }

[bootstrap.hooks]
pre-dotfiles = "mise run zsh:migrate"
