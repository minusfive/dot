[bootstrap.packages]
"brew:lazygit" = "latest"

[dotfiles]
"lazygit/config/lazygit/config.yml" = { source = "~/dev/personal/dot/home/.config/lazygit/config.yml", mode = "symlink", variants = [{ default = true, target = "{{ xdg_config_home }}/lazygit/config.yml" }] }
"lazygit/config/lazygit/theme.yml" = { source = "~/dev/personal/dot/home/.config/lazygit/theme.yml", mode = "symlink", variants = [{ default = true, target = "{{ xdg_config_home }}/lazygit/theme.yml" }] }
"~/.config/zsh/.zshrc-zone-3.zsh/lazygit" = { source = "~/dev/personal/dot/home/.config/lazygit/zshrc.zsh", template = "tera" }
