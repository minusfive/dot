[bootstrap.packages]
"brew:gh" = "latest"

[bootstrap.hooks]
post-packages = 'gh extension install --force "yusukebe/gh-markdown-preview"'

[bootstrap.directories."~/.config/gh/personal"]
mode = "0755"

[dotfiles]
"~/.config/gh/personal/hosts.yml" = { source = "~/dev/personal/dot/home/.config/gh/personal/hosts.yml", mode = "symlink" }
"~/dev/personal/mise.toml/gh-config" = { source = "~/dev/personal/dot/home/.config/gh/gh-personal.mise.toml", template = "tera", merge = true }
"~/dev/work/mise.toml/gh-config" = { source = "~/dev/personal/dot/home/.config/gh/gh-work.mise.toml", template = "tera", merge = true }
