[bootstrap.packages]
"brew-cask:claude-code" = "latest"

[dotfiles]
"~/.claude/agents/orchestrator.md" = { source = "~/dev/personal/dot/home/.agents/agents/orchestrator.md", mode = "symlink" }
"~/.claude/settings.json" = { source = "~/dev/personal/dot/home/.claude/settings.json", mode = "symlink" }
"~/.claude/skills" = { source = "~/dev/personal/dot/home/.agents/skills", mode = "symlink-each", exclude = ["**/evals/**"] }
"~/.claude/statusline-command.sh" = { source = "~/dev/personal/dot/home/.claude/statusline-command.sh", mode = "symlink" }
