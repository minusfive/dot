[bootstrap.repos]
"~/.config/oh-my-zsh/custom/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git" }

[dotfiles]
"p10k/config/zsh/.p10k.zsh" = { source = "~/dev/personal/dot/home/.config/zsh/.p10k.zsh", mode = "symlink", variants = [{ default = true, target = "{{ xdg_config_home }}/zsh/.p10k.zsh" }] }
"~/.config/zsh/.zshrc/p10k" = { source = "~/dev/personal/dot/home/.config/p10k/zshrc.zsh", template = "tera" }
"~/.config/zsh/.zshrc-zone-2.zsh/p10k" = { source = "~/dev/personal/dot/home/.config/p10k/zshrc-zone-2.zsh", template = "tera" }
