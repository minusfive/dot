[bootstrap.packages]
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
# 1Password for Safari
"mas:1569813296" = "latest"

[dotfiles]
"~/.config/1Password/ssh/agent.toml" = { source = "~/dev/personal/dot/home/.config/1Password/ssh/agent.toml", mode = "symlink" }
"~/.ssh/config" = { source = "~/dev/personal/dot/home/.ssh/config", mode = "symlink" }
"~/.config/zsh/.zshrc-zone-3.zsh/onepassword" = { source = "~/dev/personal/dot/home/.config/1Password/zshrc.zsh", template = "tera" }
