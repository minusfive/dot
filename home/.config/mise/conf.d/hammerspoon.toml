[bootstrap.packages]
"brew-cask:hammerspoon" = "latest"

[dotfiles]
"hammerspoon/config/hammerspoon" = { source = "~/dev/personal/dot/home/.config/hammerspoon", mode = "symlink-each", exclude = [".luarc.json"], variants = [{ default = true, target = "{{ xdg_config_home }}/hammerspoon" }] }

[bootstrap.hooks]
post-dotfiles = [
    "defaults write org.hammerspoon.Hammerspoon MJConfigFile {{ (xdg_config_home ~ '/hammerspoon/init.lua') | quote }}",
]
