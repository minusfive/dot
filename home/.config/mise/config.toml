[settings]
# paranoid = true
trusted_config_paths = ["~/dev/personal", "~/dev/personal/dot", "~/dev/work"]
env_file = ".env"
experimental = true
idiomatic_version_file_enable_tools = ["node"]
terminal_progress = false
lockfile = true
minimum_release_age = "7d"

[settings.dotfiles]
relative_symlinks = true

# Use the canonical persisted profile as DOT_PROFILE's default only when the
# caller does not provide DOT_PROFILE. This uses mise's Tera template support
# to read the XDG state file:
# https://mise.jdx.dev/templates.html#miserc-template-support
[env]
DOT_PROFILE = { default = "{% if (xdg_state_home ~ '/minusfive/profile') is file %}{{ read_file(path=xdg_state_home ~ '/minusfive/profile') | trim }}{% else %}work{% endif %}" }
