# Require the minimum mise release that this repository supports.
# https://mise.jdx.dev/configuration.html#minimum-mise-version
min_version = "2026.10.7"

[settings]
# paranoid = true
trusted_config_paths = ["~/dev/personal", "~/dev/personal/dot", "~/dev/work"]
env_file = ".env"
experimental = true
idiomatic_version_file_enable_tools = ["node"]
terminal_progress = false
lockfile = true
minimum_release_age = "7d"

[settings.dotfiles]
relative_symlinks = true

# Use the canonical persisted profile as the default for native profile task
# selection and existing DOT_PROFILE consumers. This uses mise's Tera template
# support to read the XDG state file:
# https://mise.jdx.dev/templates.html#miserc-template-support
[env]
MISE_ENV = { default = "{% if (xdg_state_home ~ '/minusfive/profile') is file and (read_file(path=xdg_state_home ~ '/minusfive/profile') | trim) == 'personal' %}personal{% else %}work{% endif %}" }
DOT_PROFILE = { default = "{% if (xdg_state_home ~ '/minusfive/profile') is file and (read_file(path=xdg_state_home ~ '/minusfive/profile') | trim) == 'personal' %}personal{% else %}work{% endif %}" }
