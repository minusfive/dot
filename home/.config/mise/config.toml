# Require the minimum mise release that this repository supports.
# https://mise.jdx.dev/configuration.html#minimum-mise-version
min_version = "2026.10.18"

[settings]
# paranoid = true
trusted_config_paths = ["~/dev/personal", "~/dev/personal/dot", "~/dev/work"]
env_file = ".env"
experimental = true
idiomatic_version_file_enable_tools = ["node"]
terminal_progress = false
lockfile = true
minimum_release_age = "7d"

[settings.dotfiles]
relative_symlinks = true

# Resolve the active profile once for native profile selection, dotfile
# templates, and existing DOT_PROFILE consumers. Explicit environments win;
# persisted state is the fallback:
# https://mise.jdx.dev/templates.html#miserc-template-support
[vars]
resolved_profile = "{% if mise_env is defined and mise_env | length > 0 %}{{ mise_env[0] }}{% elif (xdg_state_home ~ '/minusfive/profile') is file and (read_file(path=xdg_state_home ~ '/minusfive/profile') | trim) == 'personal' %}personal{% else %}work{% endif %}"

[env]
MISE_ENV = { default = "{{ vars.resolved_profile }}" }
DOT_PROFILE = { default = "{{ vars.resolved_profile }}" }
